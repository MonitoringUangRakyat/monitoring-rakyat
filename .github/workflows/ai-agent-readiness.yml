name: AI Agent Readiness Patrol

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [public_submission]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-agent-readiness
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hardening unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate Gudang DB readiness
        run: |
          python scripts/generate_ai_index.py
          python scripts/validate_gudang_db.py
          python scripts/validate_immutable_db.py
          python scripts/import_public_submissions.py
          python scripts/promote_public_submissions.py
          python scripts/seed_fiscal_baseline.py
          python scripts/import_nemesis_procurement.py
          python scripts/pre_github_readiness.py --write
          python scripts/build_source_patrol.py
          python scripts/source_health_watchdog.py
          python scripts/ai_pengawas_orchestrator.py
          python scripts/promote_ai_hunter_candidates.py
          python scripts/build_evidence_recovery_queue.py
          python scripts/sanitize_public_submission_refs.py
          python scripts/generate_ai_index.py
          python scripts/build_dashboard_summary.py
          python scripts/build_fiscal_ratio_summary.py

      - name: HARD GATE - verified evidence only
        run: python scripts/validate_publication_gate.py --write --strict

      - name: Commit verified readiness updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ai-agent): verified readiness patrol"
          file_pattern: "dashboard/dashboard_summary.json dashboard/fiscal_ratio_annual.json dashboard/nemesis_integration_status.json dashboard/public_submission_status.json dashboard/pre_github_readiness.json dashboard/ai_agent_tasks.json dashboard/ai_agent_source_patrol.json dashboard/ai_orchestrator_status.json dashboard/ai_hunter_promotion_status.json dashboard/publication_gate_status.json dashboard/source_health.json dashboard/source_recovery_tasks.json dashboard/evidence_recovery_tasks.json dashboard/verification_inventory.json docs/PRE_GITHUB_READINESS_REPORT.md docs/AI_ORCHESTRATOR_24_7_REPORT.md docs/PUBLICATION_GATE_REPORT.md gudang-db/_index/ai_index.json gudang-db/_intake/public_submissions.csv gudang-db/_queue/ai_pengawas_candidates.json gudang-db/_queue/ai_pengawas_candidates.csv gudang-db/_queue/nemesis_procurement_candidates.json gudang-db/_queue/nemesis_procurement_candidates.csv gudang-db/_queue/public_submissions.json gudang-db/_queue/public_submissions.csv gudang-db/3_era_modern_2011_2026/*.csv"
