name: Deploy Public Intake Worker

on:
  push:
    branches: [main]
    paths:
      - "public-intake-worker/**"
      - ".github/workflows/deploy-public-intake-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Validate Worker syntax
        run: node --check public-intake-worker/src/index.js

      - name: Detect Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected; deployment is enabled."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; deployment will be skipped, not faked."
          fi

      - name: Deploy Worker with Wrangler v4
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: public-intake-worker
        run: npx --yes wrangler@4 deploy --strict

      - name: Report deployment not configured
        if: steps.cloudflare.outputs.configured != 'true'
        run: |
          echo "::notice::Public Intake Worker code is validated but not deployed because CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are absent."
